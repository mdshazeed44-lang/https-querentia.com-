<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" fill="none" aria-hidden="true">
  <defs>
    <style>
      .navy { stroke: #0D1B2A; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .navy-thin { stroke: #0D1B2A; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .navy-hair { stroke: #0D1B2A; stroke-width: 2.2; fill: #0D1B2A; stroke-linejoin: round; }
      .orange-fill { fill: #FF6B2B; stroke: #0D1B2A; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
      .white-fill { fill: #FFFFFF; stroke: #0D1B2A; stroke-width: 1.8; stroke-linejoin: round; }
      .cyan-ring { fill: #FFFFFF; stroke: #00C2FF; stroke-width: 2.4; }
      .arc { stroke: #0D1B2A; stroke-width: 1.5; fill: none; opacity: 0.45; stroke-linecap: round; }
      .cyan-fill { fill: #00C2FF; stroke: #0D1B2A; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Decorative connecting arc linking team circles to figure -->
  <path class="arc" d="M 70 130 Q 130 75, 220 75 Q 310 75, 380 110 Q 440 145, 430 220" />
  <!-- Secondary thread from figure shoulder up to active connection -->
  <path class="arc" d="M 220 195 Q 180 150, 130 130" stroke-dasharray="3 4" />
  <path class="arc" d="M 280 195 Q 330 150, 380 110" stroke-dasharray="3 4" />

  <!-- ========== TEAMMATE CIRCLE: top-left (small) ========== -->
  <g transform="translate(75 130)">
    <circle class="white-fill" cx="0" cy="0" r="26" />
    <!-- tiny face -->
    <circle cx="-5" cy="-3" r="1.4" fill="#0D1B2A" />
    <circle cx="5" cy="-3" r="1.4" fill="#0D1B2A" />
    <path class="navy-thin" d="M -5 5 Q 0 9, 5 5" stroke-width="1.8" />
    <!-- hair tuft -->
    <path class="navy-hair" d="M -12 -8 Q -10 -16, 0 -16 Q 10 -16, 12 -8 Q 8 -11, 0 -11 Q -8 -11, -12 -8 Z" />
  </g>

  <!-- ========== TEAMMATE CIRCLE: top-right (BIGGER, ACTIVE — cyan ring) ========== -->
  <g transform="translate(380 110)">
    <circle class="cyan-ring" cx="0" cy="0" r="32" />
    <circle cx="-6" cy="-4" r="1.6" fill="#0D1B2A" />
    <circle cx="6" cy="-4" r="1.6" fill="#0D1B2A" />
    <path class="navy-thin" d="M -6 6 Q 0 11, 6 6" stroke-width="2" />
    <!-- hair: short -->
    <path class="navy-hair" d="M -14 -9 Q -13 -19, 0 -19 Q 13 -19, 14 -9 Q 9 -13, 0 -13 Q -9 -13, -14 -9 Z" />
    <!-- subtle pulse dot indicating "active" -->
    <circle cx="22" cy="-22" r="4" fill="#00C2FF" />
    <circle cx="22" cy="-22" r="4" fill="#00C2FF" opacity="0.3" />
  </g>

  <!-- ========== TEAMMATE CIRCLE: right side (small) ========== -->
  <g transform="translate(430 220)">
    <circle class="white-fill" cx="0" cy="0" r="22" />
    <circle cx="-4" cy="-3" r="1.2" fill="#0D1B2A" />
    <circle cx="4" cy="-3" r="1.2" fill="#0D1B2A" />
    <path class="navy-thin" d="M -4 5 Q 0 8, 4 5" stroke-width="1.6" />
    <!-- bun -->
    <circle cx="0" cy="-13" r="4" fill="#0D1B2A" />
    <path class="navy-hair" d="M -10 -6 Q -10 -13, 0 -13 Q 10 -13, 10 -6 Q 6 -10, 0 -10 Q -6 -10, -10 -6 Z" />
  </g>

  <!-- ========== CLOCK ICON (top-center, speed/time-to-talent) ========== -->
  <g transform="translate(230 60)">
    <circle class="white-fill" cx="0" cy="0" r="26" stroke-width="2" />
    <!-- Clock face -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#0D1B2A" stroke-width="1.8" />
    <!-- Curved arrow around clock -->
    <path class="navy-thin" d="M 12 -14 Q 22 -8, 20 4" stroke-width="2" />
    <path d="M 20 4 L 23 0 L 24 5 Z" fill="#D94F3D" stroke="#D94F3D" stroke-width="1" stroke-linejoin="round" />
    <!-- Clock hands -->
    <line x1="0" y1="0" x2="0" y2="-9" stroke="#0D1B2A" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="0" x2="7" y2="3" stroke="#D94F3D" stroke-width="2" stroke-linecap="round" />
    <!-- Center dot -->
    <circle cx="0" cy="0" r="1.6" fill="#0D1B2A" />
    <!-- 12 / 3 / 6 / 9 marks -->
    <line x1="0" y1="-14" x2="0" y2="-12" stroke="#0D1B2A" stroke-width="1.4" />
    <line x1="14" y1="0" x2="12" y2="0" stroke="#0D1B2A" stroke-width="1.4" />
    <line x1="0" y1="14" x2="0" y2="12" stroke="#0D1B2A" stroke-width="1.4" />
    <line x1="-14" y1="0" x2="-12" y2="0" stroke="#0D1B2A" stroke-width="1.4" />
  </g>

  <!-- ========== SPARKLES (bottom-left cluster, different positions from card 1) ========== -->
  <g transform="translate(140 250)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#00C2FF" />
  </g>
  <g transform="translate(115 268)">
    <path d="M 0 -5 L 1.3 -1.3 L 5 0 L 1.3 1.3 L 0 5 L -1.3 1.3 L -5 0 L -1.3 -1.3 Z" fill="#FF6B2B" />
  </g>
  <g transform="translate(155 280)">
    <path d="M 0 -6 L 1.6 -1.6 L 6 0 L 1.6 1.6 L 0 6 L -1.6 1.6 L -6 0 L -1.6 -1.6 Z" fill="#D94F3D" />
  </g>

  <!-- ========== PLANT (left side accent) ========== -->
  <g transform="translate(380 285)">
    <!-- Pot -->
    <path d="M -14 0 L 14 0 L 11 22 L -11 22 Z" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    <line x1="-14" y1="4" x2="14" y2="4" stroke="#0D1B2A" stroke-width="1.6" stroke-linecap="round" />
    <!-- Leaves -->
    <path d="M 0 0 Q -2 -16, -12 -22 Q -10 -10, 0 0 Z" fill="none" stroke="#0D1B2A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M 0 0 Q 2 -20, 0 -32 Q -2 -20, 0 0 Z" fill="none" stroke="#0D1B2A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M 0 0 Q 2 -16, 12 -22 Q 10 -10, 0 0 Z" fill="none" stroke="#0D1B2A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
  </g>

  <!-- ========== CENTRAL FIGURE ========== -->
  <!-- Ground line -->
  <line class="navy" x1="130" y1="328" x2="370" y2="328" stroke-width="2" />

  <!-- Desk (small) -->
  <path fill="#FFFFFF" stroke="#0D1B2A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"
        d="M 175 305 L 325 305 L 325 312 L 175 312 Z" />
  <line x1="190" y1="312" x2="190" y2="328" stroke="#0D1B2A" stroke-width="2" stroke-linecap="round" />
  <line x1="310" y1="312" x2="310" y2="328" stroke="#0D1B2A" stroke-width="2" stroke-linecap="round" />

  <!-- Torso: orange top -->
  <path class="orange-fill" d="M 218 205
           Q 218 192, 232 190
           L 268 190
           Q 282 192, 282 205
           L 288 268
           Q 290 280, 280 282
           L 220 282
           Q 210 280, 212 268 Z" />

  <!-- V-neck -->
  <path d="M 240 190 L 250 204 L 260 190" stroke="#0D1B2A" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Neck -->
  <path d="M 244 189 L 244 176 L 256 176 L 256 189" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Head -->
  <ellipse cx="250" cy="152" rx="23" ry="26" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="2.2" />

  <!-- Hair: pulled back with messy bun -->
  <path class="navy-hair" d="M 228 145
           Q 226 128, 240 122
           Q 250 119, 260 122
           Q 274 128, 272 145
           Q 270 138, 264 137
           Q 256 135, 250 137
           Q 244 135, 236 137
           Q 230 138, 228 145 Z" />
  <!-- Bun on top/back -->
  <circle cx="262" cy="118" r="9" fill="#0D1B2A" stroke="#0D1B2A" stroke-width="2" />
  <circle cx="262" cy="118" r="5" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3" />

  <!-- Loose strand -->
  <path class="navy-thin" d="M 272 138 Q 278 148, 274 158" />

  <!-- Ear -->
  <path class="navy-thin" d="M 227 152 Q 223 152, 223 156 Q 223 160, 227 160" />
  <!-- Earring dot -->
  <circle cx="225" cy="163" r="1.6" fill="#FF6B2B" />

  <!-- Eyes -->
  <path class="navy-thin" d="M 240 153 Q 243 156, 246 153" stroke-width="2" />
  <path class="navy-thin" d="M 254 153 Q 257 156, 260 153" stroke-width="2" />
  <!-- Eyebrows -->
  <path class="navy-thin" d="M 239 147 Q 243 145, 247 147" stroke-width="1.6" />
  <path class="navy-thin" d="M 253 147 Q 257 145, 261 147" stroke-width="1.6" />
  <!-- Smile (confident, slightly wider) -->
  <path class="navy-thin" d="M 243 164 Q 250 170, 257 164" stroke-width="2" />

  <!-- ========== LEFT ARM (holding coffee cup) ========== -->
  <!-- Orange sleeve -->
  <path class="orange-fill" d="M 218 205 Q 205 220, 200 245 L 215 250 Q 222 230, 228 220 Z" />
  <!-- Forearm exposed -->
  <path d="M 200 245 Q 195 258, 200 272" stroke="#0D1B2A" stroke-width="2.2" fill="none" stroke-linecap="round" />
  <path d="M 215 250 Q 213 258, 215 270" stroke="#0D1B2A" stroke-width="2.2" fill="none" stroke-linecap="round" />
  <!-- Hand -->
  <ellipse cx="207" cy="276" rx="9" ry="6" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="2" />

  <!-- Coffee cup in hand (cyan accent) -->
  <g transform="translate(192 268)">
    <path d="M 0 0 L 22 0 L 19 22 Q 18 26, 14 26 L 5 26 Q 1 26, 0 22 Z"
          fill="#00C2FF" stroke="#0D1B2A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Cup lid line -->
    <line x1="0" y1="5" x2="22" y2="5" stroke="#0D1B2A" stroke-width="1.8" stroke-linecap="round" />
    <!-- Sleeve band -->
    <line x1="1" y1="14" x2="21" y2="14" stroke="#0D1B2A" stroke-width="1.4" stroke-linecap="round" opacity="0.6" />
    <!-- Steam -->
    <path d="M 7 -4 Q 5 -8, 7 -12 Q 9 -16, 7 -20" stroke="#0D1B2A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5" />
    <path d="M 14 -4 Q 16 -8, 14 -12 Q 12 -16, 14 -20" stroke="#0D1B2A" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- ========== RIGHT ARM (resting on desk, gesturing slightly) ========== -->
  <path class="orange-fill" d="M 282 205 Q 295 220, 300 250 L 285 260 Q 280 235, 272 220 Z" />
  <path d="M 300 250 Q 308 270, 305 285" stroke="#0D1B2A" stroke-width="2.2" fill="none" stroke-linecap="round" />
  <path d="M 285 260 Q 290 275, 290 285" stroke="#0D1B2A" stroke-width="2.2" fill="none" stroke-linecap="round" />
  <ellipse cx="298" cy="292" rx="10" ry="6" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="2" transform="rotate(15 298 292)" />

  <!-- Ground shadow -->
  <ellipse cx="250" cy="332" rx="110" ry="4" fill="#0D1B2A" opacity="0.08" />
</svg>
