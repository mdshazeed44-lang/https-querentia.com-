<svg viewBox="0 0 480 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Querentia monogram circle and registered wordmark — Precision. Impact. Integrity.">
  <!-- Option 2: Monogram circle + wordmark -->
  <circle cx="48" cy="66" r="34" fill="none" stroke="#00C2FF" stroke-width="2.5" />
  <text x="48" y="79" font-family="Familjen Grotesk, Arial, sans-serif" font-weight="700" font-size="46" fill="#0D1B2A" text-anchor="middle">Q</text>

  <!-- Wordmark -->
  <text x="100" y="70" font-family="Familjen Grotesk, Arial, sans-serif" font-weight="600" font-size="46" letter-spacing="0.5" fill="#0D1B2A">Querentia</text>

  <!-- Registered mark: circle + R at wordmark top-right -->
  <circle cx="318" cy="40" r="7" fill="none" stroke="#0D1B2A" stroke-width="1.4" />
  <text x="318" y="43" font-family="Familjen Grotesk, Arial, sans-serif" font-weight="600" font-size="8" fill="#0D1B2A" text-anchor="middle">R</text>

  <!-- Tagline -->
  <text x="102" y="103" font-family="Familjen Grotesk, Arial, sans-serif" font-weight="600" font-size="11" letter-spacing="3" fill="#5A6478">PRECISION<tspan fill="#00C2FF"> &#183; </tspan>IMPACT<tspan fill="#00C2FF"> &#183; </tspan>INTEGRITY</text>
</svg>
