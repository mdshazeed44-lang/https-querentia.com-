<svg viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Querentia registered wordmark — Precision. Impact. Integrity.">
  <!-- Option 1: Wordmark -->
  <text x="20" y="62" font-family="Familjen Grotesk, Arial, sans-serif" font-weight="600" font-size="50" letter-spacing="0.5"><tspan fill="#00C2FF">Q</tspan><tspan fill="#0D1B2A">uerentia</tspan></text>

  <!-- Registered mark: circle + R at wordmark top-right -->
  <circle cx="254" cy="30" r="7" fill="none" stroke="#0D1B2A" stroke-width="1.4" />
  <text x="254" y="33" font-family="Familjen Grotesk, Arial, sans-serif" font-weight="600" font-size="8" fill="#0D1B2A" text-anchor="middle">R</text>

  <!-- Tagline -->
  <text x="22" y="100" font-family="Familjen Grotesk, Arial, sans-serif" font-weight="600" font-size="11" letter-spacing="3" fill="#5A6478">PRECISION<tspan fill="#FF6B2B"> . </tspan>IMPACT<tspan fill="#FF6B2B"> . </tspan>INTEGRITY</text>
</svg>
